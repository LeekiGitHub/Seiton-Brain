name: Feature / story
description: New behavior or improvement suggestion
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Larger features should align with [ROADMAP.md](../../ROADMAP.md).
        Reference an existing story when possible (e.g. `E47-1`).

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem should this solve? For whom?
      placeholder: "As a self-hoster, I want to …"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Optional — how might this be implemented?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: phase
    attributes:
      label: Rough roadmap area
      options:
        - Unclear
        - Phase L — Launch hardening (E27–E31, E47)
        - Phase M–O — Ecosystem / Knowledge AI / Teams
        - Phase I — Managed cloud (future, ADR 0007)
        - Idea / backlog only
    validations:
      required: false
