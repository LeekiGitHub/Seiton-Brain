name: Bug
description: Something does not work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** post secrets (API keys, bot tokens, `.env` contents).
        Security vulnerabilities: see [SECURITY.md](../../SECURITY.md) — do not report here.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Brief description of the problem.
      placeholder: "After sending a voice message, the worker stops processing …"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up
        2. Send Telegram message
        3. …
    validations:
      required: true

  - type: dropdown
    id: deploy_mode
    attributes:
      label: Deployment mode
      options:
        - Development (docker compose)
        - Consumer / home box (install.sh)
        - VPS (deploy-vps.sh)
        - Local without Docker
        - Unknown
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit / tag / branch
      placeholder: "main @ abc1234 or v0.3.0"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: e.g. `docker compose logs worker --tail 50`
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: docs
    attributes:
      label: Checklist
      options:
        - label: I read docs/setup.md and docs/self-hosting.md
          required: false
