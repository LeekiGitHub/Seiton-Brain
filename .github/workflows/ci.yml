name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests

      - name: Pytest
        run: pytest

      - name: MCP client tests
        run: |
          pip install -r examples/mcp/seiton-brain-mcp/requirements.txt
          pytest examples/mcp/seiton-brain-mcp/tests

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build API image
        run: docker build -t seiton-brain:ci .

  migrate-and-vector-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: seitonbrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d seitonbrain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/seitonbrain
      # Dummy-Werte, falls ein Import Settings anfasst (Alembic braucht sie nicht).
      OPENAI_API_KEY: ci-smoke-key
      OBSIDIAN_VAULT_PATH: /tmp/seiton-ci-vault
      REDIS_URL: redis://localhost:6379/0
      SEITON_API_KEY: ci-smoke-api-key
      SEITON_LICENSE_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: pgvector smoke insert
        run: python scripts/ci_vector_smoke.py
