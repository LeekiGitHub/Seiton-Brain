<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Seiton Brain{% endblock %}</title>
  <meta name="theme-color" content="#0f1419" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/ui/static/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/ui/static/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/ui/static/app.css" />
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="wrap{% block wrap_class %}{% endblock %}">
    <nav class="topnav">
      <a class="brand" href="/dashboard">Seiton Brain</a>
      {% if active != 'login' %}
      <a href="/dashboard" class="{% if active == 'dashboard' %}active{% endif %}">Dashboard</a>
      <a href="/ask" class="{% if active == 'ask' %}active{% endif %}">Suchen &amp; Fragen</a>
      <a href="/notes" class="{% if active == 'notes' %}active{% endif %}">Notizen</a>
      <a href="/settings" class="{% if active == 'settings' %}active{% endif %}">Einstellungen</a>
      <a href="/setup" class="{% if active == 'setup' %}active{% endif %}">Setup</a>
      {% if ui_auth_enabled() %}
      <form method="post" action="/logout" class="logout-form">
        <button type="submit" class="logout-link">Abmelden</button>
      </form>
      {% endif %}
      {% endif %}
    </nav>
    {% block content %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
